name: build

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/keList/keList.csproj

      - name: Build
        run: dotnet build src/keList/keList.csproj -c Release --no-restore

      - name: Publish portable release
        run: >
          dotnet publish src/keList/keList.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keList-win-x64
          path: publish/win-x64/
